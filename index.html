<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="This a simple random flip coing game" />
    <link
      rel="icon"
      href="resources/favicon.ico"
      type="image/x-icon"
      sizes="96x96"
    />

    <link rel="stylesheet" href="assets/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

    <title>Flip the coin | devChallenges.io</title>

  </head>
  <body>
    <main>
        <div class="title">
          <h1>Flip the coin</h1>
          <p>Press the coin or the button to flip the coin</p>
        </div>
        <div class="coin-area">
          <img id="coin" src="resources/heads.svg" alt="coin" width="160" height="160" />
          <img src="resources/shadow.svg" alt="coin shadow" width="100" height="8" />

          <p>Head</p>
        </div>
        
        <div>
          <button id="button">RANDOM</button>
        </div>
    </main>

    <div class="author-info">
      Coded by <a href="#">Victor C. Ricci</a> | Challenge by
      <a href="https://www.devchallenges.io?ref=challenge" target="_blank"
        >devChallenges.io</a
      >.
    </div>

    <script src="assets/script.js"></script>
  </body>
</html>
